<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070707;--card:#101010;--gold:#d8bd72;--gold2:#bda25e;--text:#f7f4ed;--muted:#aaa69d}
html{background:#000;scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#000;color:var(--text);min-height:100vh}
.site{width:100%;max-width:520px;margin:0 auto;min-height:100vh;background:
radial-gradient(circle at 50% 8%,rgba(216,189,114,.07),transparent 24%),
linear-gradient(180deg,#080808 0%,#050505 100%);position:relative;overflow:hidden}
.site:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.04) 50%,transparent 75%)}
.wrap{position:relative;z-index:1;padding:42px 22px 40px}
.logo{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto 22px;border-radius:50%;box-shadow:0 0 50px rgba(216,189,114,.06)}
.hero{text-align:center;padding-bottom:30px}
.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.04;letter-spacing:.01em;color:var(--gold);font-weight:600}
@media(max-width:520px){.hero h1{font-size:clamp(21px,6.3vw,27px);white-space:nowrap;letter-spacing:0}}
.hero p{margin-top:9px;font-size:12px;letter-spacing:.20em;color:#d4d1ca;text-transform:uppercase}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(216,189,114,.42),transparent);margin:2px 0 24px}
.links{display:grid;gap:15px}
.link{width:100%;min-height:65px;border:1px solid var(--gold2);border-radius:10px;background:linear-gradient(180deg,#111,#0b0b0b);display:flex;align-items:center;padding:12px 15px;color:#f4f1ea;text-decoration:none;box-shadow:0 8px 28px rgba(0,0,0,.22);transition:.2s ease}
.link:active{transform:scale(.985);background:#141414}
.icon{width:38px;min-width:38px;height:38px;display:grid;place-items:center;color:var(--gold);margin-right:11px}
.icon svg{width:31px;height:31px;display:block}.icon img{width:31px;height:31px;object-fit:contain;display:block;opacity:.82;filter:saturate(.72) brightness(1.05)}.link .icon{color:#d8bd72}
.label{font-size:13px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;line-height:1.3}
.vip{opacity:1;cursor:pointer}
.vip .label:after{content:""}
.section-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center;margin:27px 0 13px}
.store{background:#0d0d0d;border:1px solid #1c1c1c;border-radius:16px;padding:17px;margin-top:13px}
.store-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.store h2{font-size:15px;letter-spacing:.08em;color:#f4f1ea}
.store small{color:var(--gold);font-size:10px;letter-spacing:.08em}
.store-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini{min-height:45px;border:1px solid rgba(216,189,114,.55);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#e9e6df;font-size:10px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;padding:8px}
.footer{text-align:center;color:#6f6d68;font-size:10px;line-height:1.6;padding:30px 5px 4px;letter-spacing:.08em;text-transform:uppercase}
@media(min-width:521px){body{background:#151515}.site{box-shadow:0 0 70px #000}}
</style>
</head>
